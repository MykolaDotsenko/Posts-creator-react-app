name: Capture README screenshots

on:
  push:
    branches:
      - docs/readme-visual-refresh
    paths:
      - "scripts/capture-readme.mjs"
      - ".github/workflows/readme-screenshots.yml"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-readme.mjs

      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git commit -m "docs: add SignalDesk product screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
