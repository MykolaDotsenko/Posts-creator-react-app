name: Prune unused test dependencies

on:
  push:
    branches:
      - feat/data-safety-cross-browser
    paths:
      - ".github/workflows/prune-unused-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Remove unused DOM test stack
        run: npm uninstall --save-dev @testing-library/jest-dom @testing-library/react @testing-library/user-event jsdom

      - name: Commit dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already clean."
            exit 0
          fi
          git commit -m "chore: remove unused DOM test dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
