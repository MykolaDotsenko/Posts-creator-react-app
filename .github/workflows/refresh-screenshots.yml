name: Refresh SignalDesk screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feat/data-safety-cross-browser
    paths:
      - "scripts/capture-readme.mjs"
      - ".github/workflows/refresh-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-readme.mjs

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "docs: refresh SignalDesk screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
